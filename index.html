<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja 3D E - Site em Construção</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; /* Azul escuro moderno */
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #38bdf8;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        p {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-links {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn-links:hover {
            background-color: #0ea5e9;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Substitua o caminho da imagem caso use na raiz ou dentro de pastas -->
        <img src="images/logo1.jpeg" alt="Logo Loja 3D E" class="logo">
        
        <h1>Estamos de Cara Nova!</h1>
        <p>Nosso site principal está passando por uma grande reformulação para trazer um portfólio incrível e profissional para você. Em breve novidades por aqui!</p>
        
        <a href="/links" class="btn-links">Acessar Redes Sociais e Links</a>

        <div class="footer">
            Copyright &copy; 2026 Loja 3dê • Todos os direitos reservados.
        </div>
    </div>

</body>
</html>
